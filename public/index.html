<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Station Network</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101113;color:#f7f7f7}header{background:#19130f;border-bottom:3px solid #ff7a00;padding:20px}header h1{margin:0;color:#ff8a1f}header p{color:#bba793;margin:5px 0 0}main{max-width:1500px;margin:auto;padding:18px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.summary-card{min-width:145px;background:#201914;border:1px solid #503821;border-radius:12px;padding:13px}.summary-card strong{display:block;font-size:27px;color:#ff922b}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.72fr);gap:16px}.panel{background:#1b1713;border:1px solid #4d3725;border-radius:14px;overflow:hidden}.panel-header{padding:14px 16px;border-bottom:1px solid #463221;display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-header h2{margin:0;font-size:18px;color:#ff922b}.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:14px}.card{background:#211912;border:1px solid #543a21;border-radius:12px;padding:14px}.card.offline{opacity:.6}.top{display:flex;justify-content:space-between;gap:10px}.station-id{font-size:21px;font-weight:bold;color:#ff922b}.location{color:#a99583;margin-top:3px;font-size:13px}.badge{border-radius:999px;padding:5px 9px;height:max-content;font-size:11px;font-weight:bold}.on{background:#16351f;color:#78ef99}.off{background:#3b1b1b;color:#ff8e8e}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.metric{background:#15110e;border:1px solid #392a1f;border-radius:9px;padding:10px}.metric small{color:#a99583}.metric strong{display:block;color:#ffd0a0;margin-top:5px}.meta{margin-top:11px;color:#978675;font-size:12px;line-height:1.5}.log-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #614329;background:#17110d;color:#fff;border-radius:7px;padding:8px 10px}button{cursor:pointer;background:#a64e08}#logs{height:620px;overflow:auto;padding:10px;font-family:Consolas,Monaco,monospace;font-size:12px;background:#0b0d0e}.log-line{padding:5px 7px;border-bottom:1px solid #1c2225;white-space:pre-wrap;overflow-wrap:anywhere}.log-time{color:#7f929c}.log-source{color:#d8b38d}.level-SUCCESS{color:#7ff09d}.level-ERROR{color:#ff7575}.level-WARN{color:#ffc66d}.level-RX{color:#70c7ff}.level-OTA{color:#d79cff}.level-INFO{color:#ddd}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5b5b5b;margin-right:6px}.live-dot.connected{background:#59e47b}.empty{color:#aa9886;padding:20px}@media(max-width:1000px){.layout{grid-template-columns:1fr}#logs{height:420px}}
</style>
</head>
<body>
<header><h1>Weather Station Network</h1><p>N-station dashboard + live MQTT/server logs</p></header>
<main>
<section class="summary"><div class="summary-card">Total Stations<strong id="total">0</strong></div><div class="summary-card">Online<strong id="online">0</strong></div><div class="summary-card">Offline<strong id="offline">0</strong></div><div class="summary-card">Live Stream<strong id="streamState">--</strong></div></section>
<div class="layout">
<section class="panel"><div class="panel-header"><h2>Stations</h2><div><span id="liveDot" class="live-dot"></span><span id="liveText">Connecting...</span></div></div><div id="stations" class="stations"><div class="empty">Waiting for station data...</div></div></section>
<section class="panel"><div class="panel-header"><h2>Live Logs</h2><div class="log-toolbar"><select id="levelFilter"><option value="ALL">All</option><option value="RX">MQTT RX</option><option value="INFO">Info</option><option value="SUCCESS">Success</option><option value="WARN">Warning</option><option value="ERROR">Error</option><option value="OTA">OTA</option></select><button id="autoBtn" type="button">Auto-scroll: ON</button><button id="clearBtn" type="button">Clear View</button></div></div><div id="logs"></div></section>
</div>
</main>
<script>
const stationState=new Map(),logState=[];let autoScroll=true,selectedLevel="ALL";const stationRoot=document.getElementById("stations"),logsRoot=document.getElementById("logs");const fmt=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):"--";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderStations(){const list=[...stationState.values()].sort((a,b)=>String(a.station_id).localeCompare(String(b.station_id)));total.textContent=list.length;online.textContent=list.filter(s=>s.online).length;offline.textContent=list.filter(s=>!s.online).length;if(!list.length){stationRoot.innerHTML='<div class="empty">Waiting for station data...</div>';return}stationRoot.innerHTML=list.map(s=>`<article class="card ${s.online?"":"offline"}"><div class="top"><div><div class="station-id">${esc(s.station_id)}</div><div>${esc(s.station_name||s.station_id)}</div><div class="location">${esc(s.location||"")}</div></div><span class="badge ${s.online?"on":"off"}">${s.online?"ONLINE":"OFFLINE"}</span></div><div class="metrics"><div class="metric"><small>Temperature</small><strong>${fmt(s.temperature,1)} °C</strong></div><div class="metric"><small>Pressure</small><strong>${fmt(s.pressure,1)} hPa</strong></div><div class="metric"><small>Wind</small><strong>${fmt(s.wind_speed,2)} m/s</strong></div><div class="metric"><small>Rain</small><strong>${esc(s.rain||"--")}</strong></div></div><div class="meta">Firmware: ${esc(s.firmware||"--")}<br>IP: ${esc(s.ip||"--")}<br>Last seen: ${esc(s.last_seen?new Date(s.last_seen).toLocaleString():"--")}</div></article>`).join("")}
function renderLogs(){const filtered=selectedLevel==="ALL"?logState:logState.filter(l=>l.level===selectedLevel);logsRoot.innerHTML=filtered.map(l=>`<div class="log-line"><span class="log-time">${esc(new Date(l.time).toLocaleTimeString())}</span> <span class="level-${esc(l.level)}">[${esc(l.level)}]</span> <span class="log-source">[${esc(l.source)}]</span> ${esc(l.message)}</div>`).join("");if(autoScroll)logsRoot.scrollTop=logsRoot.scrollHeight}
function addLog(log){logState.push(log);while(logState.length>500)logState.shift();renderLogs()}
Promise.all([fetch('/api/stations').then(r=>r.json()),fetch('/api/logs?limit=150').then(r=>r.json())]).then(([ss,ll])=>{ss.forEach(s=>stationState.set(s.station_id,s));ll.forEach(l=>logState.push(l));renderStations();renderLogs()}).catch(e=>addLog({time:new Date().toISOString(),level:'ERROR',source:'BROWSER',message:e.message}));
levelFilter.addEventListener('change',e=>{selectedLevel=e.target.value;renderLogs()});autoBtn.addEventListener('click',()=>{autoScroll=!autoScroll;autoBtn.textContent=`Auto-scroll: ${autoScroll?'ON':'OFF'}`;if(autoScroll)logsRoot.scrollTop=logsRoot.scrollHeight});clearBtn.addEventListener('click',()=>{logState.length=0;renderLogs()});
const events=new EventSource('/events');events.addEventListener('connected',()=>{liveDot.classList.add('connected');liveText.textContent='Live connected';streamState.textContent='LIVE'});events.addEventListener('station',e=>{const s=JSON.parse(e.data);stationState.set(s.station_id,s);renderStations()});events.addEventListener('log',e=>addLog(JSON.parse(e.data)));events.onerror=()=>{liveDot.classList.remove('connected');liveText.textContent='Reconnecting...';streamState.textContent='--'};
</script>
</body>
</html>
